[project]
name = "aam-backup-automation"
version = "1.1.3"
description = "AAM Backup Automation — nightly backup via Robocopy (LAN) and Rclone (GCS), orchestrated by Prefect 3"
readme = "DEPLOYMENT_GUIDE.md"
requires-python = ">=3.12"
authors = [{ name = "AAM Associates" }]
classifiers = ["Operating System :: Microsoft Windows"]

dependencies = [
    "prefect==3.9.4",
    "pydantic==2.14.4",
    "loguru==0.8.0",
    "pyyaml==6.0.3",
    "wakeonlan==3.3.0",
    "fastapi==0.150.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "pendulum==3.3.0",
    "psutil==7.2.2",
    "ruamel.yaml==0.19.1",
    "humanize==4.17.0",
    "python-multipart==0.0.34",
    "cron-descriptor==1.4.5",
    "tenacity==9.2.1",
    "filelock==4.2.12",
    "sqlalchemy<2.1",
    "websockets<17",
    "certifi>=2026.10.19",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]
pythonpath = ["."]
markers = ["anonymous: the test uses a TestClient that is NOT signed in (tests of the sign-in itself)"]

[dependency-groups]
dev = [
    "hypothesis==6.170.16",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "pytest-timeout==2.4.0",
    "ruff==0.17.6",
    "time-machine==3.6.0",
]
